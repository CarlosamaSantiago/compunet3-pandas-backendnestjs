name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nest_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: nest_backend_test
      DB_DATABASE_TEST: nest_backend_test
      JWT_SECRET: ci_secret_not_for_production
      JWT_EXPIRATION: 1h
      SEED_ADMIN_PASSWORD: ci_admin_password_only
      SEED_USER_PASSWORD: ci_user_password_only
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: |
          npm run test:resolver
          npm test -- --runInBand

      - name: Apply database migrations
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Coverage
        run: npm run test:cov -- --runInBand

      - name: Build
        run: npm run build

      - name: Validate integrated Postman collection
        run: |
          npm run postman:build
          git diff --exit-code -- postman/backend-api.postman_collection.json

      - name: Seed and verify Tasks through Postman
        run: |
          npm run railway:predeploy
          node dist/main.js > /tmp/taskflow-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health > /dev/null
          npm run postman:tasks
